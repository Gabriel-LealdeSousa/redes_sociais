{% extends "base.html" %}

{% block title %}Mudança de Senha{% endblock %}

{% block content %}

<h1>Mudança de Senha</h1>
<p>Por favor, use o seguinte formulário para mudar sua senha:</p>
<form method="post">
    {{ form.as_p }}
    <p><input type="submit" value="Mudar senha"></p>
    {% csrf_token %}
</form>
{% endblock %}
